name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin
        run: ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-timer-windows-x64
          path: release/*-windows-x64.zip
          if-no-files-found: error

      - name: Attach artifact to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*-windows-x64.zip
