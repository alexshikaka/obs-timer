name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package plugin
        run: ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-timer-windows-x64
          path: release/*-windows-x64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem release/*-windows-x64.zip | Select-Object -First 1 -ExpandProperty FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip --title "obs-timer $tag" --notes "Dockable timer for OBS Studio 33+. See the README for installation."
          } else {
            gh release upload $tag $zip --clobber
          }
